name: Build & deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    # Every 3 hours — keeps the Tank-a-thon and records fresh between visits.
    # (The page also re-pulls live scores from Sleeper in the browser.)
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build data bundle from Sleeper
        env:
          SLEEPER_LEAGUE_ID: ${{ vars.SLEEPER_LEAGUE_ID || '1312156446493794305' }}
        run: node scripts/build-data.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll _site/

      # Pages must already be enabled with "GitHub Actions" as the source
      # (Settings -> Pages). GITHUB_TOKEN isn't allowed to turn it on itself.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
